name: Build desktop apps
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test core and browser script
        run: zsh macOS/test.sh
      - name: Test native WKWebView first submission
        run: zsh macOS/test-webkit.sh
      - name: Build universal app
        run: zsh macOS/source/build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent macOS/CampusConnect.app CampusConnect-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-macOS-universal
          path: CampusConnect-macOS-universal.zip
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test core and native layouts
        run: dotnet run --project Windows/tests -c Release
      - name: Test browser automation
        run: node Windows/tests/portal.test.mjs
      - name: Test desktop pages
        shell: pwsh
        run: |
          npm install --no-save --prefix Windows/tests playwright@1.58.2
          npx --prefix Windows/tests playwright install chromium
          node Windows/tests/desktop.test.cjs
          node Windows/tests/eportal.test.cjs
          node Windows/tests/portal-early.test.cjs
          node Windows/tests/performance.test.cjs
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Test installer file manifest
        run: python Windows/installer/test-manifest.py
      - name: Build setup installer
        shell: pwsh
        run: ./Windows/build-installer.ps1 -Runtime ${{ matrix.runtime }}
      - name: Test single-file startup, shortcuts, repair, upgrade and uninstall
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./Windows/installer/smoke-test.ps1 -Installer ./Windows/installer/dist/CampusConnect-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-Setup-${{ matrix.runtime }}
          path: Windows/installer/dist/*-Setup.exe
