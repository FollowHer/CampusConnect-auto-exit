name: Build and publish FollowHer auto-exit
on:
  push:
    branches: [main, master]
    tags: ['v*', 'windows-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auto-exit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test core and browser script
        run: zsh macOS/test.sh
      - name: Test native WKWebView first submission
        run: zsh macOS/test-webkit.sh
      - name: Test automatic exit lifecycle
        run: zsh macOS/test-lifecycle.sh
      - name: Build universal app
        run: zsh macOS/source/build.sh
      - name: Package app
        run: |
          lipo -verify_arch arm64 x86_64 macOS/CampusConnect.app/Contents/MacOS/CampusConnect
          codesign --verify --deep --strict macOS/CampusConnect.app
          ditto -c -k --sequesterRsrc --keepParent macOS/CampusConnect.app CampusConnect-macOS-universal-2.0.4-auto-exit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-macOS-universal
          path: CampusConnect-macOS-universal-2.0.4-auto-exit.zip
  windows:
    name: windows (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
            runner: windows-latest
          - runtime: win-arm64
            arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test core and native layouts
        run: dotnet run --project Windows/tests -c Release
      - name: Test automatic exit lifecycle
        run: dotnet run --project Windows/exit-tests -c Release
      - name: Test browser automation
        run: node Windows/tests/portal.test.mjs
      - name: Test desktop pages
        shell: pwsh
        run: |
          npm install --no-save --prefix Windows/tests playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed.' }
          npx --prefix Windows/tests playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }
          foreach ($test in @('desktop', 'wired', 'agreements', 'recovery', 'eportal', 'portal-early', 'performance')) {
            node "Windows/tests/$test.test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "$test tests failed." }
          }
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Test installer file manifest
        run: python Windows/installer/test-manifest.py
      - name: Build setup installer
        shell: pwsh
        run: ./Windows/build-installer.ps1 -Runtime ${{ matrix.runtime }}
      - name: Test single-file startup, shortcuts, repair, upgrade and uninstall
        shell: pwsh
        run: ./Windows/installer/smoke-test.ps1 -Installer ./Windows/installer/dist/CampusConnect-Windows-${{ matrix.arch }}-Setup.exe
      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics-${{ matrix.runtime }}
          path: Windows/installer/work/smoke-diagnostics/
          if-no-files-found: ignore
      - name: Name release installer
        shell: pwsh
        run: Copy-Item Windows/installer/dist/CampusConnect-Windows-${{ matrix.arch }}-Setup.exe CampusConnect-Windows-${{ matrix.arch }}-2.0.4-auto-exit-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-Setup-${{ matrix.runtime }}
          path: CampusConnect-Windows-${{ matrix.arch }}-2.0.4-auto-exit-Setup.exe
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'FollowHer/CampusConnect-auto-exit'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CampusConnect-*
          path: release
          merge-multiple: true
      - name: Publish verified release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-fork-release.sh
